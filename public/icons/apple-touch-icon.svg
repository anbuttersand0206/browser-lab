<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!--
    Apple Touch Icon (180×180)。
    iOS は PNG を推奨するが、モダン Safari は SVG に対応している。
    角丸は iOS 側が自動で適用するため、ここでは付けない。
  -->
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="aliq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <clipPath id="aclip">
      <path d="M 72 28 L 72 74 L 27 140 Q 21 154 35 154 L 145 154 Q 159 154 153 140 L 108 74 L 108 28 Z"/>
    </clipPath>
  </defs>

  <rect width="180" height="180" fill="url(#abg)"/>

  <path d="M 72 28 L 72 74 L 27 140 Q 21 154 35 154 L 145 154 Q 159 154 153 140 L 108 74 L 108 28 Z"
        fill="none" stroke="#4fc3f7" stroke-width="8" stroke-linejoin="round"/>

  <rect x="65" y="21" width="50" height="11" rx="5.5" fill="#4fc3f7"/>

  <rect x="18" y="108" width="144" height="58" fill="url(#aliq)" opacity="0.88" clip-path="url(#aclip)"/>

  <circle cx="76"  cy="130" r="6.5" fill="#b3e5fc" opacity="0.60"/>
  <circle cx="96"  cy="122" r="4.5" fill="#b3e5fc" opacity="0.48"/>
  <circle cx="112" cy="136" r="3"   fill="#b3e5fc" opacity="0.36"/>
</svg>
